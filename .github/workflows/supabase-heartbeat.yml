# Keep the Supabase project from pausing.
#
# A free project pauses after seven days with no DATABASE activity — loading
# the dashboard does not count. One row read a week resets that clock, which
# matters only until real users exist: every entitlement check REX makes is
# activity, so this is insurance for the quiet period before launch.
#
# SUPABASE_URL and SUPABASE_ANON_KEY are repository secrets. The anon key is
# designed to be public — it ships in client code and RLS is what protects the
# data — but there is no reason to print it in a log either.
name: Supabase heartbeat

on:
  schedule:
    - cron: "0 3 * * 1"   # 03:00 UTC every Monday
  workflow_dispatch:       # and on demand, to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY is not set — nothing to ping."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "${URL%/}/rest/v1/heartbeat?select=id&limit=1" -H "apikey: $KEY")
          echo "heartbeat responded $code"
          # A 4xx means the project answered, which is all the clock cares about;
          # only a total failure to reach it is worth failing the run over.
          [ "$code" != "000" ] || { echo "could not reach the project"; exit 1; }
